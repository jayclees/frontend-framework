<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        .BlockIdentifier,
        .DirectiveIdentifier,
        .EventListenerIdentifier {
            color: #FF9800; /* orange 500 */
        }

        .AttrIdentifier {
            color: #80DEEA; /* cyan 200 */
        }

        .DirectiveOpen,
        .DirectiveClose,
        .DirectiveColon,
        .BlockOpen,
        .BlockClose,
        .AttrColon {
            color: #42A5F5; /* blue 400 */
        }

        .EventListenerOpen,
        .EventListenerClose,
        .EventListenerColon {
            color: #9575CD; /* deep purple 300 */
        }

        .EventListenerHandler {
            color: #F48FB1; /* pink 200 */
        }

        .DirectiveValue {
            color: #FFF176; /* yellow 300 */
        }

        .StringExpr,
        .Expression {
            color: #258800;
        }

        .LineComment,
        .BlockComment {
            color: #6a6a6a;
        }

        .Colon {
            color: #ffffff;
        }
    </style>
</head>
<body>
<div class="container-fluid p-4"><pre><code>{REPLACE}</code></pre></div>
</body>
</html>
