[package]
name = "frontend"
version = "0.1.0"
edition = "2024"
default-run = "frontend"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
html-escape = "0.3.0"
remove = "0.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
fake = { version = "5", features = ["derive"] }

[[bin]]
name = "cli"
path = "src/cli.rs"
